name: Publish Release APK

on:
  release:
    types: [published]
  push:
    branches:
      - develop
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version / tag (e.g. v1.0.0). Defaults to app/build.gradle.kts version if omitted.'
        required: false
        default: ''
      draft:
        description: 'Create release as draft'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark release as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Determine Version and Release Policy
        id: versioning
        run: |
          TAG=""
          # 1. From release event
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          # 2. From git tag push
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          # 3. From workflow_dispatch input
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          fi

          # 4. Fallback from app/build.gradle.kts
          GRADLE_VERSION=$(grep 'versionName' app/build.gradle.kts | head -n1 | sed 's/.*"\(.*\)".*/\1/')
          if [ -z "$GRADLE_VERSION" ]; then
            GRADLE_VERSION="1.0"
          fi

          if [ -z "$TAG" ]; then
            TAG="v${GRADLE_VERSION}"
          fi

          # Clean version name (strip leading 'v' if present)
          CLEAN_VERSION="${TAG#v}"
          # Standard tag (ensure starts with 'v')
          if [[ "$TAG" != v* ]]; then
            TAG="v${TAG}"
          fi

          # Extract versionCode from app/build.gradle.kts
          GRADLE_CODE=$(grep 'versionCode' app/build.gradle.kts | head -n1 | sed 's/[^0-9]*//g')
          if [ -z "$GRADLE_CODE" ]; then
            GRADLE_CODE="1"
          fi

          # Determine whether to publish release
          SHOULD_PUBLISH="false"
          if [ "${{ github.event_name }}" = "release" ] || \
             [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             [[ "${{ github.ref }}" == refs/tags/* ]] || \
             [[ "${{ github.event.head_commit.message }}" == *"[release]"* ]]; then
            SHOULD_PUBLISH="true"
          fi

          echo "TAG_NAME=$TAG" >> $GITHUB_ENV
          echo "VERSION_NAME=$CLEAN_VERSION" >> $GITHUB_ENV
          echo "VERSION_CODE=$GRADLE_CODE" >> $GITHUB_ENV
          echo "SHOULD_PUBLISH=$SHOULD_PUBLISH" >> $GITHUB_ENV

          echo "============================================="
          echo "Resolved Tag Name:     $TAG"
          echo "Resolved Version Name: $CLEAN_VERSION"
          echo "Resolved Version Code: $GRADLE_CODE"
          echo "Publish Release:       $SHOULD_PUBLISH"
          echo "============================================="

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease \
            -PversionName="${{ env.VERSION_NAME }}" \
            -PversionCode="${{ env.VERSION_CODE }}" \
            --no-daemon --stacktrace

      - name: Prepare APK Asset
        id: prepare_apk
        run: |
          # Find the built release APK
          APK_SOURCE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_SOURCE" ]; then
            APK_SOURCE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi

          if [ -z "$APK_SOURCE" ] || [ ! -f "$APK_SOURCE" ]; then
            echo "::error::No APK found in app/build/outputs/apk!"
            exit 1
          fi

          DEST_APK="FreezerToFeast-${{ env.TAG_NAME }}.apk"
          cp "$APK_SOURCE" "$DEST_APK"

          echo "APK_PATH=$DEST_APK" >> $GITHUB_ENV
          echo "Prepared APK: $DEST_APK (Size: $(ls -lh "$DEST_APK" | awk '{print $5}'))"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TAG_NAME }}-apk
          path: ${{ env.APK_PATH }}
          retention-days: 14

      - name: Publish APK to GitHub Release
        if: env.SHOULD_PUBLISH == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          files: ${{ env.APK_PATH }}
          generate_release_notes: true
          draft: ${{ github.event.inputs.draft == 'true' }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
