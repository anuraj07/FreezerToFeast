<body class="font-body-md text-body-md overflow-hidden selection:bg-secondary-container">

<!-- Login Form -->
<form action="#" class="w-full space-y-8">
<div class="space-y-6">
<!-- Email Field -->
<div class="relative group input-focus-effect transition-all duration-500 rounded-xl px-4 py-2 border-b border-outline-variant/30">
<label class="block font-label-sm text-label-sm uppercase tracking-widest text-outline mb-1" for="email">
                            Email
                        </label>
<input class="block w-full border-0 bg-transparent p-0 text-primary placeholder:text-outline-variant focus:ring-0 font-body-md text-body-md transition-all duration-300" id="email" name="email" placeholder="your@essence.com" required="" type="email"/>
</div>
<!-- Password Field -->
<div class="relative group input-focus-effect transition-all duration-500 rounded-xl px-4 py-2 border-b border-outline-variant/30">
<div class="flex justify-between items-end">
<label class="block font-label-sm text-label-sm uppercase tracking-widest text-outline mb-1" for="password">
                                Password
                            </label>
<a class="font-label-sm text-label-sm text-outline-variant hover:text-primary transition-colors mb-1 duration-300" href="#">
                                Forgot Password
                            </a>
</div>
<input class="block w-full border-0 bg-transparent p-0 text-primary placeholder:text-outline-variant focus:ring-0 font-body-md text-body-md transition-all duration-300" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Primary Action -->
<div class="pt-4">
<button class="w-full h-14 bg-primary-container text-secondary-fixed font-label-md text-label-md tracking-widest uppercase rounded-full ambient-lift hover:opacity-90 active:scale-[0.98] transition-all duration-500 ease-in-out flex items-center justify-center gap-3" type="submit">
                        Enter the Kitchen

</button>
</div>

<span class="material-symbols-outlined text-[20px] opacity-60 group-hover:opacity-100">fingerprint</span>

<script>
        // Simple micro-interaction for input fields
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('border-primary');
                input.parentElement.classList.remove('border-outline-variant/30');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('border-primary');
                input.parentElement.classList.add('border-outline-variant/30');
            });
        });

        // Slow hover effect for the button
        const btn = document.querySelector('button[type="submit"]');
        btn.addEventListener('mousemove', (e) => {
            const rect = btn.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            btn.style.setProperty('--x', `${x}px`);
            btn.style.setProperty('--y', `${y}px`);
        });
    </script>
