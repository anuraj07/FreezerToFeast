<body class="bg-background text-on-background font-body-md overflow-hidden antialiased">
<!-- Header / Brand Anchor (Minimal implementation for onboarding) -->
<header class="fixed top-0 left-0 w-full z-50 h-20 flex justify-between items-center px-container-padding-mobile md:px-container-padding-desktop">
<h1 class="font-display-lg text-headline-md text-primary tracking-tight">Freezer-to-Feast</h1>
<div class="w-10 h-10 rounded-full bg-surface-variant/50 flex items-center justify-center">
<span class="material-symbols-outlined text-primary" style="font-size: 20px;">info</span>
</div>
</header>
<main class="relative h-screen w-full flex flex-col md:flex-row overflow-hidden">
<!-- Hero Image Section (Left on Desktop) -->
<section class="relative w-full h-[530px] md:h-full md:w-1/2 overflow-hidden bg-surface-dim">
<div class="absolute inset-0 bg-primary/10 mix-blend-multiply z-10"></div>
<img alt="Artisanal fresh vegetables on a rustic table" class="w-full h-full object-cover transform scale-105 transition-transform duration-[20s] ease-linear hover:scale-110" data-alt="A high-end, atmospheric close-up of fresh, artisanal ingredients including organic leafy greens, heirloom carrots, and rustic herbs spread across a dark marble kitchen island. The lighting is soft and directional, casting gentle shadows that emphasize the tactile textures of the food. The color palette is dominated by deep greens and earthy tones, reflecting a quiet luxury aesthetic. The overall mood is serene, intentional, and deeply grounded in wellness." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB7ZyS7RillPPlj_CLjFpMWyX3wF26XFamYN9PrctJ1EIuIPSHyZsJ9tyTJVuC3gmb9JBM92zqQ49mtvmWH_4TJo-pGQz7xddWjWjA4RJuZKw_e6p_KwHl272n9lNp3ZLxv-vtX8jzu90qbCzMotVf0-bkq8EaMYDPsKF-7nKkls2f2du6Pgnw-eCXhnwAqmvjcEjaE_GuIJ9iYPxkk2k7XddG72fGbwUJZorHk8obSyJbL1bk-VaozkuOkobVawWqnoaGCeif6tTA"/>
<!-- Decorative Subtle Gradient -->
<div class="absolute inset-0 bg-gradient-to-t from-background via-transparent to-transparent md:bg-gradient-to-r md:from-transparent md:to-background z-20"></div>
</section>
<!-- Content Section (Right on Desktop) -->
<section class="relative w-full h-[353px] md:h-full md:w-1/2 flex flex-col justify-center px-container-padding-mobile md:px-container-padding-desktop bg-background z-30">
<div class="max-w-md mx-auto md:mx-0 fade-in">
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest mb-4 block">The Art of Sustenance</span>
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary mb-6 leading-tight">
                    Nourish with Intention
                </h2>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-10 leading-relaxed italic opacity-90">
                    Step into a world where every ingredient is a choice, and every meal is a ritual of restoration and mindful presence.
                </p>
<div class="flex flex-col gap-6">
<button class="group relative bg-primary-container text-secondary-container font-label-md text-label-md py-5 px-10 rounded-full transition-all duration-500 ease-in-out hover:opacity-90 hover:scale-[1.02] luxury-shadow flex items-center justify-center gap-3">
                        Begin your journey
                        <span class="material-symbols-outlined transition-transform duration-300 group-hover:translate-x-1">arrow_forward</span>
</button>
<button class="font-label-md text-label-md text-primary/60 hover:text-primary transition-colors duration-300 py-2">
                        I already have an account
                    </button>
</div>
</div>
<!-- Pagination Dots (Bottom) -->
<div class="absolute bottom-12 left-1/2 -translate-x-1/2 md:left-container-padding-desktop md:translate-x-0 flex items-center gap-3">

<div class="w-1.5 h-1.5 rounded-full bg-outline-variant hover:bg-outline transition-colors cursor-pointer"></div>

</div>
</section>
</main>
<!-- Ambient Subtle Background Texture (CSS Pattern) -->
<div class="fixed inset-0 pointer-events-none opacity-[0.03] z-[1]" style="background-image: radial-gradient(#3e4631 0.5px, transparent 0.5px); background-size: 24px 24px;"></div>
<script>
        // Micro-interaction for the button and image parallax
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) - 0.5;
            const y = (e.clientY / window.innerHeight) - 0.5;
            
            const heroImage = document.querySelector('section img');
            if (heroImage) {
                heroImage.style.transform = `scale(1.1) translate(${x * 20}px, ${y * 20}px)`;
            }
        });

        // Initialize any specific UI state
        window.addEventListener('DOMContentLoaded', () => {
            const container = document.querySelector('.fade-in');
            if (container) {
                container.style.opacity = '1';
            }
        });
    </script>
